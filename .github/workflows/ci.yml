name: TrustFed CI & Security Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Security, Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff

      - name: Validate Environment Schema
        run: |
          cp .env.example .env
          python -c "from backend.config import settings; print('Config Validated:', settings.get_sanitized_summary())"

      - name: Run Ruff Linter
        run: |
          ruff check backend/ --select E,F,W --ignore E501

      - name: Execute Pytest Suite (All 35 Tests)
        run: |
          pytest

  frontend-ci:
    name: Frontend TypeScript Build & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run Security Audit
        working-directory: ./frontend
        run: npm audit --audit-level=high

      - name: Build & Typecheck (Vite + TypeScript)
        working-directory: ./frontend
        run: npm run build
