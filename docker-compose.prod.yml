version: '3.8'

services:
  trustfed-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustfed-production-api
    restart: always
    environment:
      - APP_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8001
      - TRUSTFED_SECRET_KEY=${TRUSTFED_SECRET_KEY:-prod-secure-trustfed-secret-key-32bytes-min}
      - FRONTEND_ORIGINS=https://trustfed.internal,https://app.trustfed.io
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
        reservations:
          cpus: '1.0'
          memory: 1024M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8001/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: trustfed-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis-data:
